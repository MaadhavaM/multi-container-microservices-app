<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Management - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<!-- dark toggle always visible on login -->
<button class="global-dark" id="globalDarkBtn" onclick="toggleDark()">Dark Mode</button>

<!-- ══════════ FORGOT PASSWORD MODAL ══════════ -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('forgotModal')">&times;</button>
    <div class="modal-title">Reset Password</div>
    <div class="modal-desc">Enter your username and your current password to set a new one.</div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" id="fgUser" placeholder="Your username" />
    </div>
    <div class="form-group">
      <label class="form-label">Current Password</label>
      <input class="form-input" type="password" id="fgCurrentPass" placeholder="Current password" />
    </div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <input class="form-input" type="password" id="fgNewPass" placeholder="New password (min 4 chars)" />
    </div>
    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <input class="form-input" type="password" id="fgConfirmPass" placeholder="Confirm new password" />
    </div>
    <button class="modal-btn" onclick="doResetPassword()">Update Password</button>
    <div class="modal-msg" id="fgMsg"></div>
  </div>
</div>

<!-- ══════════ LOGIN PAGE ══════════ -->
<div id="loginPage">
  <div class="bg-circle bg-c1"></div>
  <div class="bg-circle bg-c2"></div>
  <div class="bg-circle bg-c3"></div>
  <div class="bg-circle bg-c4"></div>
  <div class="bg-circle bg-c5"></div>

  <div class="login-card">
    <div class="card-logo">N</div>
    <div class="card-title">Notes Management Webapplication</div>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div class="auth-msg" id="authMsg"></div>

    <!-- ── LOGIN FORM ── -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="loginUser"
            placeholder="Username"
            autocomplete="username" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="loginPass"
            placeholder="Enter your password"
            autocomplete="current-password" />
          <button class="input-icon-btn" onclick="togglePwd('loginPass',this)" type="button">Show</button>
        </div>
      </div>
      <div class="form-row">
        <button class="forgot-link" onclick="openModal('forgotModal')" type="button">Forgot password?</button>
      </div>
      <button class="auth-submit" onclick="doLogin()">Login</button>
    </div>

    <!-- ── SIGNUP FORM ── -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" id="signupName" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" id="signupUser"
          placeholder="Username"
          oninput="validateUsername(this.value)" />
        <div class="field-hint" id="userHint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="signupEmail" placeholder="yourname@email.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="signupPass"
            placeholder="Create a strong password"
            oninput="checkStrength(this.value)" />
          <button class="input-icon-btn" onclick="togglePwd('signupPass',this)" type="button">Show</button>
        </div>
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-text" id="strengthText"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="signupConfirm"
            placeholder="Repeat your password"
            oninput="checkConfirm()" />
          <button class="input-icon-btn" onclick="togglePwd('signupConfirm',this)" type="button">Show</button>
        </div>
        <div class="field-hint" id="confirmHint"></div>
      </div>
      <button class="auth-submit" onclick="doSignup()">Create Account</button>
    </div>


  </div>
</div>

<script src="global.js"></script>
<script src="auth.js"></script>
</body>
</html>
