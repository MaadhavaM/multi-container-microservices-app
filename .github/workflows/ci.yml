name: INT332 - Multi-Container Microservices CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test-backend:
    name: Test Backend Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: ./backend
        run: python -m py_compile app.py && echo "Backend syntax OK"

  build-docker-images:
    name: Build All Microservice Images
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Build backend microservice image
        run: docker build -t microservices-backend:latest ./backend

      - name: Build frontend microservice image
        run: docker build -t microservices-frontend:latest ./frontend

      - name: List all built images
        run: docker images

  validate-compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    needs: build-docker-images
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Validate docker-compose.yml
        run: docker compose config && echo "Docker Compose config is valid"