version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: microservices-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: microservicesdb
      TZ: Asia/Kolkata     
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: microservices-backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: microservicesdb
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: microservices-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data: